apiVersion: v1
kind: Pod
metadata:
  name: todoapp-1
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    ports:
    - containerPort: 8000
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
    livenessProbe:
      httpGet:
        path: api/liveness/
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/readiness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5

---

apiVersion: v1
kind: Pod

metadata:
  name: todoapp-2
  namespace: todoapp
  labels:
    app: todolist

spec:
  containers:
    - name: todoapp
      image: ikulyk404/todoapp:3.0.0

      ports:
        - containerPort: 8000

      env:
        - name: PYTHONUNBUFFERED
          value: "1"

      readinessProbe:
        httpGet:
          path: /api/readiness/
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /api/liveness/
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 5
